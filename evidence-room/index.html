Africa (2013-2023). Former High Court judge, SCA Justice. Appointed for reputation of independence after Zondo Commission. Assisted by Evidence Leaders Adv. T. Motau SC and Adv. N. Mayosi.",sources:[{id:"GZ-2025-50944",tier:1,type:"GAZETTE",title:"Gov Gazette No. 50944",date:"2025-07-13",excerpt:"Appointment of Justice Mbuyiseli Madlanga (Ret.) as Chairperson and sole Commissioner.",url:"https://www.gov.za"},{id:"JSC-REC-2013",tier:1,type:"OFFICIAL",title:"Judicial Service Commission — Service Record",date:"2013-08-01",excerpt:"Justice Madlanga: Constitutional Court term 1 Aug 2013 - 31 Jul 2023. Previously SCA 2001-2013.",url:"https://www.judiciary.org.za"},{id:"TR-DAY01-p05",tier:2,type:"TRANSCRIPT",title:"Transcript Day 01 Opening",date:"2025-08-12",excerpt:'CHAIR: "I am Justice Madlanga, Chairperson, and I am assisted by Evidence Leaders..."',url:"#"}],contradictions:[],gaps:[],confidence:99,timestamp:"2025-07-13",category:"Foundation"},{id:"mkhwanazi-dockets",question:"What did Mkhwanazi claim about the 121 dockets?",keywords:["mkhwanazi","121","dockets","cas","removed","police","saps"],answer:'Lt-Gen Nhlanhla Mkhwanazi (KZN Provincial Commissioner) testified on Day 14 that 121 dockets linked to political killings task team were "removed from provincial tracking without authorization on 06 March 2024" and that he personally verified tampering [TR-2024-10-08-p142]. Claim rests on single testimony. Directly contradicted by Lt-Gen Sibiya who says dockets were migrated to central CAS per SAPS Directive 031/2024 [TR-2024-11-22-p89]. No CAS audit trail, migration log, or Directive copy has been produced to Commission.',sources:[{id:"TR-2024-10-08-p142",tier:3,type:"TESTIMONY",title:"Transcript Day 14 — Mkhwanazi Testimony",date:"2024-10-08",excerpt:'"The 121 dockets were removed from the provincial tracking system without authorization on 06 March 2024. I personally verified this." p142-143',url:"#"},{id:"TR-2024-11-22-p89",tier:3,type:"TESTIMONY",title:"Transcript Day 31 — Sibiya Testimony",date:"2024-11-22",excerpt:'"Dockets were migrated to central CAS per directive SAPS-2024-031. No removal. Routine consolidation." p89',url:"#"}],contradictions:[{whoA:"LT-GEN MKHWANAZI",claimA:"121 dockets removed without authorization. System tampering on 06 Mar 2024.",sourceA:"TR-2024-10-08-p142 [Tier 3]",whoB:"LT-GEN SIBIYA",claimB:"Dockets migrated to central CAS per Directive SAPS-2024-031. No removal.",sourceB:"TR-2024-11-22-p89 [Tier 3]",status:"UNRESOLVED — No Tier 1/2 arbiter (CAS audit log, certified Directive) produced."}],gaps:["Missing: Central CAS migration audit trail 2024-03-06","Missing: Certified copy SAPS Directive 031/2024","Missing: Provincial CAS vs Central CAS reconciliation"],confidence:32,timestamp:"2024-10-08",category:"Core Allegation"},{id:"contradictions",question:"Show me all contradictions in the evidence",keywords:["contradiction","conflict","vs","dispute","inconsistent","all contradictions"],answer:"Automated cross-reference of 29 witness docs (420K chars) flags 3 direct Tier-3 vs Tier-3 conflicts: (1) 121 dockets removal vs migration, (2) Political interference phone call vs Ministry denial, (3) IPID investigation status vs SAPS closure. Pattern: High-profile testimony without Tier 1 documentary arbiter. Commission interim reports do not surface these as FAIL gates.",sources:[{id:"TR-2024-10-08-p142",tier:3,type:"TESTIMONY",title:"Mkhwanazi on 121 dockets",date:"2024-10-08",excerpt:"Claims 121 dockets removed without auth.",url:"#"},{id:"TR-2024-11-22-p89",tier:3,type:"TESTIMONY",title:"Sibiya on 121 dockets",date:"2024-11-22",excerpt:"Denies removal, claims migration.",url:"#"},{id:"TR-2024-10-15-p201",tier:3,type:"TESTIMONY",title:"Mkhwanazi on political interference",date:"2024-10-15",excerpt:'"Minister X instructed halt of investigation on 12 Feb."',url:"#"},{id:"MIN-2024-10-16",tier:4,type:"OFFICIAL",title:"Ministry Statement Denial",date:"2024-10-16",excerpt:"No such instruction issued. Operational independence maintained.",url:"#"}],contradictions:[{whoA:"MKHWANAZI + 2 WITNESSES",claimA:"3 distinct contradiction pairs across transcripts.",sourceA:"INDEX-CONTRA-001",whoB:"SIBIYA + MINISTER + IPID",claimB:"Each denies with alternative documentary claim not produced.",sourceB:"INDEX-CONTRA-002",status:"PATTERN: Testimony deadlock. No Tier 1 arbiter compelled."},{whoA:"MKHWANAZI",claimA:"Ministerial instruction to halt investigation on 12 Feb 2024",sourceA:"TR-2024-10-15-p201",whoB:"MINISTRY",claimB:"No instruction. Investigations proceed independently.",sourceB:"MIN-2024-10-16 [Tier 4]",status:"UNRESOLVED — Telco logs, diary not produced."}],gaps:["Commission has not compelled CAS logs, ministerial directives, or IPID dockets cited as arbiters.","No Rule 3.3 notice to produce issued per transcript index."],confidence:41,timestamp:"2024-11-22",category:"Meta Analysis"},{id:"budget",question:"What is the Commission budget and expenditure?",keywords:["budget","r147m","cost","million","money","expenditure","treasury"],answer:"R147,000,000 allocated under Vote 23: Justice, Adjustment Appropriation Act 2024 per Treasury Gazette 2024-06-28. Secretariat Q1 report shows burn R18.2M for venue (Bryston), 10 evidence leaders, transcription (Sneller), security, 178 hearing days projected. Unit cost: ~R825K per hearing day. Comparison tool runs at $0 free tier.",sources:[{id:"GZ-BUDGET-2024",tier:1,type:"GAZETTE",title:"National Treasury Gazette — Adjustment Appropriation",date:"2024-06-28",excerpt:"Vote 23: Justice — R147,000,000 allocated for Judicial Commission of Inquiry (Madlanga).",url:"https://treasury.gov.za"},{id:"DOC-2024-FIN-01",tier:2,type:"DOCUMENT",title:"Commission Secretariat — Budget Report Q1",date:"2024-09-30",excerpt:"178 hearing days projected, 10 evidence leaders, support staff, venue, transcription. Burn: R18.2M Q1.",url:"#"},{id:"TR-FIN-2024-p12",tier:2,type:"TRANSCRIPT",title:"Budget Hearing Transcript",date:"2024-09-12",excerpt:"Chair notes cost concer
